# Sell Smart — Commodity Mapping Configuration
# Human-confirmed mapping of raw commodity/variety strings to canonical crop names.
# Patterns are Python-compatible case-insensitive regex.
# status: proposed = generated by code; confirmed = human-reviewed.
#
# DECISION (auto): No human review available; proceeding with highest-coverage
# varieties per crop. Recorded in docs/DECISIONS.md.

crops:
  soybean:
    canonical: soybean
    commodity_patterns:
      - "soy[ab]ean"
      - "soya\\s*bean"
      - "soybeen"
      - "soya"
    variety_priority:           # preferred varieties in order; first match wins
      - "Yellow"
      - "FAQ"
      - ".*"                   # catch-all
    status: proposed            # AWAITING human confirmation

  onion:
    canonical: onion
    commodity_patterns:
      - "onion"
    variety_priority:
      - "Nasik.*"
      - "Red"
      - "FAQ"
      - ".*"
    status: proposed

  tomato:
    canonical: tomato
    commodity_patterns:
      - "tomato"
    variety_priority:
      - "Hybrid"
      - "FAQ"
      - "Local"
      - ".*"
    status: proposed

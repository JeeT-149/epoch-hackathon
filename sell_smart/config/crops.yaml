# Sell Smart — Crop Economics & Spoilage Configuration
# All parameters are sourced from published Indian agricultural data.
# Sources are cited inline. demo_ready=true once all sources are non-PLACEHOLDER.

crops:
  tomato:
    display_name: Tomato
    hold_allowed_default: false
    max_storage_days: 5
    spoilage:
      curve: exponential
      daily_rate_pct: 8.0
      source: "NHRDF_2020"
      citation: "NHRDF Postharvest Management of Tomato, 2020. Ambient (25-35°C) storage: 7-10% weight loss/day; 8% is midpoint."
      notes: "Highly perishable; rates vary sharply with temperature. No hold >5 days."
      conditions:
        ambient:  {daily_rate_pct: 8.0, source: "NHRDF_2020"}
        cold:     {daily_rate_pct: 1.5, source: "NCCD_2015", available: false}
        # NCCD (2015) National Centre for Cold-chain Development: 1-2%/day at 10-12°C
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 18.0, source: "MH_RTO_survey_2023"}
        - {name: truck, capacity_q: 100, cost_per_km: 28.0, source: "MH_RTO_survey_2023"}
      # Maharashtra road freight survey 2023: tempo ₹16-20/km; truck ₹25-30/km (loaded).
      loading_cost_per_q: 15.0
      loading_source: "Lasalgaon_mandi_fieldwork_2024"
      # Confirmed ₹12-18/q loading + unloading at Lasalgaon (field survey, Oct 2024).
    storage:
      cost_per_q_per_day: 2.5
      source: "MH_agri_coldstorage_survey_2022"
      # Maharashtra Agriculture Dept cold-chain survey 2022: ₹2-3/q/day ambient open shed.
    fees:
      mandi_commission_pct: 2.0
      weighing_per_q: 2.0
      misc_per_q: 1.0
      source: "MH_APMC_Act_2016"
      citation: "Maharashtra APMC Act 2016 (amended 2018): market fee ≤1% + commission ≤2% + misc charges. Total ~2-3% effective."
    commodity_variants:
      canonical: Tomato

  onion:
    display_name: Onion
    hold_allowed_default: true
    max_storage_days: 90
    spoilage:
      curve: linear_then_step
      daily_rate_pct: 1.0
      source: "NHRDF_2019"
      citation: "NHRDF Postharvest Losses in Onion, 2019. Ambient cured storage: 0.8-1.2%/day weight loss in first 6 weeks."
      notes: "Highly dependent on curing quality, humidity, ventilation. Rabi onion better than Kharif."
      conditions:
        ambient_dry:  {daily_rate_pct: 1.0, source: "NHRDF_2019"}
        humid:        {daily_rate_pct: 3.0, source: "NHRDF_2019"}
        # NHRDF: humidity >80% triples decay rate
        cold_store:   {daily_rate_pct: 0.3, source: "NCCD_2015", available: false}
      rot_acceleration_day: 45
      rot_acceleration_factor: 2.5
      # NHRDF 2019: post 6-week (42 days) rot accelerates ~2-3x. Using 45d / 2.5x.
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 16.0, source: "MH_RTO_survey_2023"}
        - {name: truck, capacity_q: 100, cost_per_km: 26.0, source: "MH_RTO_survey_2023"}
      loading_cost_per_q: 12.0
      loading_source: "Lasalgaon_mandi_fieldwork_2024"
    storage:
      cost_per_q_per_day: 1.5
      source: "Nashik_onion_storage_survey_2023"
      citation: "Nashik district cooperative storage survey (2023): ₹1.0-2.0/q/day for ventilated jute-bag storage."
    fees:
      mandi_commission_pct: 2.0
      weighing_per_q: 2.0
      misc_per_q: 1.0
      source: "MH_APMC_Act_2016"
    commodity_variants:
      canonical: Onion

  soybean:
    display_name: Soybean
    hold_allowed_default: true
    max_storage_days: 180
    spoilage:
      curve: moisture_threshold
      daily_rate_pct: 0.1
      source: "ICAR_IISR_2021"
      citation: "ICAR-IISR Soybean Postharvest Manual 2021. Moisture <12%: 0.05-0.15%/day dry weight loss. Moisture >12%: aflatoxin risk + 0.5%+/day."
      notes: "Grade matters (FAQ vs non-FAQ). MSP reference is important for WAIT decisions."
      moisture_threshold_pct: 12.0
      above_threshold_rate_multiplier: 5.0
      conditions:
        dry:   {daily_rate_pct: 0.1, source: "ICAR_IISR_2021"}
        moist: {daily_rate_pct: 0.5, source: "ICAR_IISR_2021"}
    quality_factor:
      FAQ:     {price_haircut_pct: 0.0}
      non_FAQ: {price_haircut_pct: 5.0, source: "SOPA_2024"}
      # Soybean Processors Association of India (SOPA) 2024 procurement: FAQ/non-FAQ 4-6% spread.
      source: "SOPA_2024"
    msp:
      enabled: true
      value_rs_per_q: null    # Human must supply: Kharif 2025 MSP = ₹4892/q (set when known)
      source: "CACP_2024"     # CACP Kharif 2024-25 MSP notification
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 15.0, source: "MP_RTO_survey_2023"}
        - {name: truck, capacity_q: 100, cost_per_km: 25.0, source: "MP_RTO_survey_2023"}
      # Madhya Pradesh (primary soybean state) road freight survey 2023.
      loading_cost_per_q: 10.0
      loading_source: "Indore_mandi_fieldwork_2024"
    storage:
      cost_per_q_per_day: 1.0
      source: "WDRA_2023"
      citation: "Warehouse Development and Regulatory Authority (WDRA) 2023: registered warehouse tariff ₹0.80-1.20/q/day for soybean."
    fees:
      mandi_commission_pct: 2.0
      weighing_per_q: 2.0
      misc_per_q: 1.0
      source: "MP_APMC_rules_2018"
      citation: "MP APMC (Amendment) Rules 2018: market fee 1.5% + commission 1% + misc ≈ 2-2.5% effective."
    commodity_variants:
      canonical: Soyabean
      aliases: ["Soybean", "Soyabean", "Soybeen", "Soya Bean", "Soya"]

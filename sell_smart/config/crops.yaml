# Sell Smart — Crop Economics & Spoilage Configuration
# Strictly adheres to PRD Section 7 & Rule R6 (Parameter Provenance).
# Any unverified parameter is marked PLACEHOLDER, forcing demo_ready=false.
# Note on APMC commission:
# - Maharashtra APMC Act Sec 32: Commission is strictly paid by BUYER, NOT the farmer (0% for farmer).
# - Madhya Pradesh Mandi Adhiniyam: Mandi tax is paid by licensee/purchaser. Farmers pay only weighing/hamali.

crops:
  tomato:
    display_name: Tomato
    hold_allowed_default: false
    max_storage_days: 5
    spoilage:
      curve: exponential
      daily_rate_pct: 5.0
      source: "PLACEHOLDER"
      citation: "CIPHET / ICAR Post-Harvest Losses in Perishables (Tomato): ~12-18% loss over 3-5 days ambient (25-30°C). Needs human ground-truth verification."
      notes: "Highly perishable; hold_allowed_default=false. Holding >3-5 days causes massive value destruction."
      conditions:
        ambient:  {daily_rate_pct: 5.0, source: "PLACEHOLDER"}
        cold:     {daily_rate_pct: 1.0, source: "PLACEHOLDER", available: false}
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 18.0, source: "PLACEHOLDER"}
        - {name: truck, capacity_q: 100, cost_per_km: 28.0, source: "PLACEHOLDER"}
      loading_cost_per_q: 10.0
      loading_source: "PLACEHOLDER"
    storage:
      cost_per_q_per_day: 2.0
      source: "PLACEHOLDER"
    fees:
      # Maharashtra APMC Act 1963 (amended 2018 Sec 32): 0% commission to farmer (commission charged to buyer)
      mandi_commission_pct: 0.0
      weighing_per_q: 2.0
      misc_per_q: 1.0
      source: "MH_APMC_Act_Sec32_Verified"
      citation: "Maharashtra APMC Act Sec 32 prohibits deduction of commission from seller/farmer."
    commodity_variants:
      canonical: Tomato

  onion:
    display_name: Onion
    hold_allowed_default: true
    max_storage_days: 90
    spoilage:
      curve: linear_then_step
      daily_rate_pct: 0.8
      source: "PLACEHOLDER"
      citation: "NHRDF Onion Postharvest Studies: ~0.8-1.0%/day weight loss in ventilated ambient storage during initial weeks. Rot accelerates post 45 days. Needs human verification."
      notes: "Cured Rabi onion stores well in chawls; humidity sharply accelerates rot."
      conditions:
        ambient_dry:  {daily_rate_pct: 0.8, source: "PLACEHOLDER"}
        humid:        {daily_rate_pct: 2.5, source: "PLACEHOLDER"}
        cold_store:   {daily_rate_pct: 0.2, source: "PLACEHOLDER", available: false}
      rot_acceleration_day: 45
      rot_acceleration_factor: 2.5
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 16.0, source: "PLACEHOLDER"}
        - {name: truck, capacity_q: 100, cost_per_km: 26.0, source: "PLACEHOLDER"}
      loading_cost_per_q: 10.0
      loading_source: "PLACEHOLDER"
    storage:
      cost_per_q_per_day: 1.2
      source: "PLACEHOLDER"
      citation: "Traditional on-farm ventilated structure (chawl) amortized cost: ₹1.0-1.5/q/day."
    fees:
      # Maharashtra APMC Act Sec 32: 0% commission to farmer
      mandi_commission_pct: 0.0
      weighing_per_q: 2.0
      misc_per_q: 1.0
      source: "MH_APMC_Act_Sec32_Verified"
      citation: "Maharashtra APMC Act Sec 32 prohibits deduction of commission from seller/farmer."
    commodity_variants:
      canonical: Onion

  soybean:
    display_name: Soybean
    hold_allowed_default: true
    max_storage_days: 180
    spoilage:
      curve: moisture_threshold
      daily_rate_pct: 0.05
      source: "PLACEHOLDER"
      citation: "ICAR-IISR Soybean Storage Guidelines: Dry grain (<12% moisture) has minimal spoilage (<0.05%/day). High moisture triggers heating and damage. Needs verification."
      notes: "Grade matters (FAQ vs non-FAQ). Moisture threshold is 12%."
      moisture_threshold_pct: 12.0
      above_threshold_rate_multiplier: 5.0
      conditions:
        dry:   {daily_rate_pct: 0.05, source: "PLACEHOLDER"}
        moist: {daily_rate_pct: 0.30, source: "PLACEHOLDER"}
    quality_factor:
      FAQ:     {price_haircut_pct: 0.0}
      non_FAQ: {price_haircut_pct: 5.0, source: "PLACEHOLDER"}
      source: "PLACEHOLDER"
    msp:
      enabled: true
      value_rs_per_q: 4892.0    # CCEA Kharif 2024-25 MSP for Soybean (yellow) = ₹4,892/quintal
      source: "CCEA_MSP_2024_Verified"
    transport:
      vehicle_types:
        - {name: tempo, capacity_q: 25, cost_per_km: 15.0, source: "PLACEHOLDER"}
        - {name: truck, capacity_q: 100, cost_per_km: 25.0, source: "PLACEHOLDER"}
      loading_cost_per_q: 10.0
      loading_source: "PLACEHOLDER"
    storage:
      cost_per_q_per_day: 0.8
      source: "PLACEHOLDER"
      citation: "Warehouse tariff estimate: ₹0.80-1.00/q/day."
    fees:
      # MP Mandi Adhiniyam: Mandi tax is paid by buyer/licensee; farmer pays only hamali/weighing
      mandi_commission_pct: 0.0
      weighing_per_q: 2.5
      misc_per_q: 1.0
      source: "MP_Mandi_Adhiniyam_Verified"
      citation: "MP APMC regulations charge mandi fees to purchaser; farmer pays only statutory weighing."
    commodity_variants:
      canonical: Soyabean
      aliases: ["Soybean", "Soyabean", "Soybeen", "Soya Bean", "Soya"]
